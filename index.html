<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b18" />
    <meta name="description" content="Fight your way out of a dangerous factory in this pixel-art metroidvania." />
    <title>Metroidvania — Escape the Factory</title>
    <style>
      :root {
        color-scheme: dark;
        background: #090b18;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #20214a 0%, #111329 55%, #090b18 100%);
      }

      canvas {
        display: block;
        width: min(100vw, 177.7778vh);
        height: min(100vh, 56.25vw);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        touch-action: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main aria-label="Metroidvania game">
      <canvas aria-label="Escape the Factory game canvas" tabindex="0"></canvas>
      <p class="sr-only">Use the left and right arrow keys or A and D to move, X or Space to jump, and Z to attack. Press Enter to start.</p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
